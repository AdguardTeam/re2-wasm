---
version: 2
plan:
  project-key: AJL
  key: RE2WASMINCREMENT
  name: re2-wasm - increment
variables:
  dockerContainer: adguard/node-ssh:21.7--2

stages:
  - Increment:
      manual: true
      final: false
      jobs:
        - Increment

Increment:
  key: INCRE2WASM
  docker:
    image: "${bamboo.dockerContainer}"
  tasks:
    - checkout:
        force-clean-build: 'true'
    - script:
        interpreter: SHELL
        scripts:
          - |-
            branch="${bamboo.planRepository.branchName}"

            # Throw error if current branch is not "master",
            # because we do not deploy changes from other branches
            if [ $branch != "master" ]
            then
              echo "increment is not supported on branch ${branch}"
              exit 1;
            fi

            set -e
            set -x

            # Fix mixed logs
            exec 2>&1

            ls -alt

            npm run increment
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.vcs:task.vcs.commit
        configuration:
          commitMessage: 'skipci: Automatic increment build number'
          selectedRepository: defaultRepository
  requirements:
    - adg-docker: 'true'

branches:
  create: manually
  delete: never
  link-to-jira: 'true'

labels: [ ]

other:
  concurrent-build-plugin: system-default
